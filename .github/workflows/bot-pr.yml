name: Validación de bots

on:
  pull_request:
    paths: ["bots/**"]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # Incluye el filtro del código (tests/bot_conformance/test_codigo_seguro.py), que
      # además corre en la CI de cada PR.
      - name: Tests de conformidad
        run: pytest tests/bot_conformance -v
      - name: Mini-torneo contra los bots de referencia
        run: musst-arena --games 3 --out scoreboard_out
      - run: cat scoreboard_out/scoreboard.md >> "$GITHUB_STEP_SUMMARY"
